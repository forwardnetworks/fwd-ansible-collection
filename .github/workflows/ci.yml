name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  units:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ansible-core: ["2.17", "2.19", "2.20"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv .venv --python 3.13
          uv pip install --python .venv/bin/python "ansible-core~=${{ matrix.ansible-core }}.0" pytest "forward-sdk>=0.1.32"
      - name: Unit tests
        run: PYTHONPATH=. .venv/bin/python -m pytest ansible_collections/forwardnetworks/forward/tests/unit -q

  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: |
          uv venv .venv --python 3.13
          uv pip install --python .venv/bin/python ansible-core pytest "forward-sdk>=0.1.32"
      - name: Sanity
        run: make sanity
