---
- name: Forward Networks bulk path search example
  hosts: localhost
  gather_facts: false
  vars:
    network_id: "{{ lookup('env', 'FWD_NETWORKID') or '205507' }}"
    flows:
      - name: dmz_reachability
        from_device: edge-router-1
        dst_ip: 10.0.50.10
        intent: PREFER_DELIVERED
      - name: app_blocked_from_db
        src_ip: 10.20.30.0/24
        dst_ip: 172.16.5.10
        intent: VIOLATIONS_ONLY
  tasks:
    - name: Run bulk path search
      forwardnetworks.forward.fwd_path_search_bulk:
        network_id: "{{ network_id }}"
        queries: "{{ flows }}"
      register: bulk_paths

    - name: Assert DMZ reachable
      vars:
        dmz_result: "{{ bulk_paths.results[0] }}"
      ansible.builtin.assert:
        that:
          - (dmz_result.paths | length) > 0
        fail_msg: "No path found for DMZ flow"

    - name: Assert app to DB remains blocked
      vars:
        block_result: "{{ bulk_paths.results[1] }}"
      ansible.builtin.assert:
        that:
          - (block_result.paths | length) == 0
        fail_msg: "Unexpected delivery path for blocked flow"
