---
- name: Forward Networks bulk path search example
  hosts: localhost
  gather_facts: false
  vars:
    network_id: "{{ lookup('env', 'FORWARD_NETWORK_ID') }}"
  tasks:
    # intent applies to the whole request, so flows that need different intents are separate calls.
    - name: Flows that must be delivered
      forwardnetworks.forward.fwd_path_search_bulk:
        network_id: "{{ network_id }}"
        intent: PREFER_DELIVERED
        queries:
          - {name: dmz_reachability, from_device: edge-router-1, dst_ip: 10.0.50.10}
      register: must_deliver

    - name: Flows that must stay blocked
      forwardnetworks.forward.fwd_path_search_bulk:
        network_id: "{{ network_id }}"
        intent: VIOLATIONS_ONLY
        queries:
          - {name: app_blocked_from_db, src_ip: 10.20.30.0/24, dst_ip: 172.16.5.10}
      register: must_block

    - name: Assert DMZ reachable
      ansible.builtin.assert:
        that:
          - (must_deliver.results[0].paths | length) > 0
        fail_msg: "No path found for DMZ flow"

    - name: Assert app to DB is not delivered
      ansible.builtin.assert:
        that:
          # VIOLATIONS_ONLY returns only paths that are not delivered, so any path found is a block.
          - (must_block.results[0].paths | length) > 0
        fail_msg: "Expected the app to DB flow to be blocked, but found no non-delivered path"
