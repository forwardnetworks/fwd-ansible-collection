---
- name: Forward Networks change-control workflow (baseline, change, post snapshot, compare)
  hosts: localhost
  gather_facts: false
  vars:
    network_id: "{{ lookup('env', 'FORWARD_NETWORK_ID') }}"
    queries:
      - name: bgp_no_drops
        query_id: bgp_no_drops
      - name: acl_coverage
        query_id: acl_coverage
  tasks:
    - name: Find the baseline snapshot (latest processed, predictions excluded)
      forwardnetworks.forward.fwd_snapshots:
        network_id: "{{ network_id }}"
        latest_processed: true
      register: pre_snapshot

    - name: Fail if no baseline snapshot is available
      ansible.builtin.assert:
        that:
          - pre_snapshot.snapshot_id is not none
        fail_msg: "No processed snapshot available before change"

    - name: Run baseline NQE queries
      loop: "{{ queries }}"
      loop_control:
        label: "{{ item.name }}"
      forwardnetworks.forward.fwd_nqe_query:
        network_id: "{{ network_id }}"
        snapshot_id: "{{ pre_snapshot.snapshot_id }}"
        query_id: "{{ item.query_id }}"
      register: baseline_query_runs

    - name: Placeholder - perform network change
      ansible.builtin.debug:
        msg: "Apply network change here"

    - name: Collect a post-change snapshot and wait for it to process
      forwardnetworks.forward.fwd_snapshot_collect:
        network_id: "{{ network_id }}"
      register: post_snapshot

    - name: Run post-change NQE queries
      loop: "{{ queries }}"
      loop_control:
        label: "{{ item.name }}"
      forwardnetworks.forward.fwd_nqe_query:
        network_id: "{{ network_id }}"
        snapshot_id: "{{ post_snapshot.snapshot_id }}"
        query_id: "{{ item.query_id }}"
      register: post_query_runs

    - name: Compare baseline vs post-change
      vars:
        diff: "{{ baseline_query_runs.results[idx].rows | forwardnetworks.forward.nqe_diff(item.rows) }}"
      ansible.builtin.debug:
        msg: "{{ item.item.name }}: added={{ diff.added_count }} removed={{ diff.removed_count }}"
      loop: "{{ post_query_runs.results }}"
      loop_control:
        label: "{{ item.item.name }}"
        index_var: idx

    - name: Fail if new violations detected
      vars:
        diff: "{{ baseline_query_runs.results[idx].rows | forwardnetworks.forward.nqe_diff(item.rows) }}"
      ansible.builtin.assert:
        that:
          - diff.added_count == 0
        fail_msg: "New violations detected for {{ item.item.name }}: {{ diff.added }}"
      loop: "{{ post_query_runs.results }}"
      loop_control:
        label: "{{ item.item.name }}"
        index_var: idx

    - name: Fail if high priority checks fail on the post-change snapshot
      forwardnetworks.forward.fwd_snapshot_checks:
        snapshot_id: "{{ post_snapshot.snapshot_id }}"
        priority: [HIGH]
        status: [FAIL, ERROR]
      register: failing_checks
      failed_when: failing_checks.checks | length > 0
